name: Release info
description: "Derive the version, release channel and package release number for this build."

outputs:
  version:
    description: "The build version number."
    value: ${{ steps.version.outputs.version }}
  channel:
    description: "The release channel this build belongs to."
    value: ${{ steps.release_info.outputs.channel }}
  pkg_release:
    description: "The package release number: 1 for a tag, <run number>.<commit date>git<short commit hash> otherwise."
    value: ${{ steps.release_info.outputs.pkg_release }}

runs:
  using: composite
  steps:
    # A tag names its own version. Anything else is a development build named by
    # its commit hash, matching what cmake/XrplVersion.cmake derives: the head of
    # a pull request rather than the merge commit GitHub creates for it.
    - name: Determine version
      id: version
      shell: bash
      env:
        IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        if [[ "${IS_TAG}" == "true" ]]; then
            version="${REF_NAME}"
        else
            version="0.0.0-dev+${SHA:0:7}"
        fi

        echo "version=${version}" | tee -a "${GITHUB_OUTPUT}"

    - name: Determine release channel and package release
      id: release_info
      uses: XRPLF/actions/release-info@a9f2eeca6fb3980ba3a84cf68566f1c69ad30674
