name: Upload Conan recipe
description: "Upload recipe to a Conan remote."

inputs:
  recipe_ref:
    description: "The Conan recipe reference ('name/version') to upload."
    required: true
  remote_name:
    description: "The name of the Conan remote to use."
    required: true
  remote_url:
    description: "The URL of the Conan endpoint to use."
    required: true
  remote_username:
    description: "The username for logging into the Conan remote."
    required: true
  remote_password:
    description: "The password for logging into the Conan remote."
    required: true

runs:
  using: composite

  steps:
    - name: Set up Conan
      uses: ./.github/actions/setup-conan
      with:
        remote_name: ${{ inputs.remote_name }}
        remote_url: ${{ inputs.remote_url }}

    - name: Log into Conan remote
      shell: bash
      env:
        REMOTE_NAME: ${{ inputs.remote_name }}
        REMOTE_USERNAME: ${{ inputs.remote_username }}
        REMOTE_PASSWORD: ${{ inputs.remote_password }}
      run: conan remote login "${REMOTE_NAME}" "${REMOTE_USERNAME}" --password "${REMOTE_PASSWORD}"

    - name: Upload Conan recipe
      shell: bash
      env:
        RECIPE_REF: ${{ inputs.recipe_ref }}
        REMOTE_NAME: ${{ inputs.remote_name }}
      run: |
        conan export .
        conan upload --confirm --check --remote="${REMOTE_NAME}" ${RECIPE_REF}
