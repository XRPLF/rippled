name: Run pre-commit hooks

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - "develop"
      - "release*"
  workflow_dispatch:

jobs:
  # Call the workflow in the XRPLF/actions repo that runs the pre-commit hooks.
  run-hooks:
    uses: XRPLF/actions/.github/workflows/pre-commit.yml@d7f2acb47d9662e1e2f8b1f5feffa6d21cc3290a
    with:
      runs_on: ubuntu-latest
      container: '{ "image": "ghcr.io/xrplf/xrpld/pre-commit:sha-70b8fd3" }'
