name: Check PR title

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - develop
      - "release-*"
      - "release/*"
      - "staging/*"

jobs:
  check_title:
    if: ${{ github.event.pull_request.draft != true }}
    uses: XRPLF/actions/.github/workflows/check-pr-title.yml@ed23185d25693c9a724c3d05ae4a58371b0f72b8
