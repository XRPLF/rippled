name: Formal verification

# Runs the Lean 4 cross-validation tests and, separately, checks the proofs.
# The heavy Lean side is baked into a CI image (see the lean-image job).

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Conan writes its generators under build/generators; CMake runs from build/.
  BUILD_DIR: build

jobs:
  lean-image:
    name: Ensure Lean CI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Compute image tag
        id: meta
        # Tag = lean version + a content hash of only what the image bakes
        # (toolchain pin, dep revs, build recipe), never the model/XRPL sources,
        # so editing the model never rebuilds the image.
        env:
          INPUTS_HASH: ${{ hashFiles('formal_verification/lean-toolchain', 'formal_verification/lake-manifest.json', 'formal_verification/lakefile.toml', 'formal_verification/scripts/build_lean.sh', 'formal_verification/docker/Dockerfile', 'external/lean4/conanfile.py') }}
        run: |
          lean="$(sed 's|.*:v||' formal_verification/lean-toolchain)"
          echo "image=ghcr.io/${{ github.repository }}/lean-ci:v${lean}-${INPUTS_HASH:0:12}" >>"${GITHUB_OUTPUT}"

      - name: Log in to the GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the image if it does not exist
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "Image ${IMAGE} already exists, skipping build."
              exit 0
          fi
          docker build -f formal_verification/docker/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"

  # Elaborating the Lean files is the proof check, independent of the tests.
  check-proofs:
    name: Check proofs
    needs: lean-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.lean-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Restore the primed Lean artifacts
        run: |
          rsync -a /opt/lean-cache/.lake/ formal_verification/.lake/

      - name: Build all Lean proofs
        working-directory: formal_verification
        run: |
          lake build

  build-test:
    name: Build and test
    needs: lean-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.lean-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get number of processors
        uses: XRPLF/actions/get-nproc@cf0433aa74563aead044a1e395610c96d65a37cf
        id: nproc
        with:
          subtract: 1

      - name: Set compiler environment
        uses: ./.github/actions/set-compiler-env
        with:
          compiler: gcc

      - name: Setup Conan
        uses: ./.github/actions/setup-conan

      - name: Restore the primed Lean artifacts
        run: |
          rsync -a /opt/lean-cache/.lake/ formal_verification/.lake/

      - name: Export the lean4 Conan recipe
        run: |
          conan export external/lean4

      # build-deps + the formal_verification option. lean4 is prebuilt in the
      # image's Conan cache; the Lean library builds in-tree from the restored
      # .lake, so mathlib is never recompiled.
      - name: Build dependencies
        run: |
          conan install \
              --profile:all ci \
              --build=missing \
              --options:host '&:tests=True' \
              --options:host '&:xrpld=True' \
              --options:host '&:formal_verification=True' \
              --settings:all build_type=Release \
              --conf:all tools.build:jobs=${{ steps.nproc.outputs.nproc }} \
              --lockfile-partial \
              .

      - name: Configure CMake
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          cmake \
              -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE:FILEPATH=build/generators/conan_toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              ..

      - name: Build the binary
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          cmake \
              --build . \
              --parallel ${{ steps.nproc.outputs.nproc }} \
              --target xrpld

      - name: Run the formal verification test suite
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          # xrpld's build rpath resolves the Lean dylibs; conanrun.sh adds the
          # Lean runtime to the library path as a belt-and-suspenders fallback.
          [ -f generators/conanrun.sh ] && . generators/conanrun.sh
          ./xrpld --unittest=formal_verification
