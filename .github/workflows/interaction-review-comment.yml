# Posts (or updates) the advisory comment produced by `interaction-review.yml`.
#
# Runs on `workflow_run` so it executes from the base repository with write
# access to pull requests, while never checking out or executing PR code. Its
# only input is the `interaction-review` artifact: a rendered markdown body and
# the PR number it belongs to.
#
# An existing comment is found by its HTML marker and rewritten in place, so a
# PR carries one comment that is kept current rather than one comment per push.

name: Feature-interaction review comment

on:
  workflow_run:
    workflows: ["Feature-interaction review"]
    types: [completed]

defaults:
  run:
    shell: bash

env:
  MARKER: "<!-- interaction-review -->"
  DOWNLOAD_DIR: /tmp/interaction-review

jobs:
  post:
    name: Post the advisory comment
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # Read the triggering run's artifact; write the comment. No contents write.
      actions: read
      pull-requests: write
    steps:
      - name: Download the report
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "${DOWNLOAD_DIR}"
          if ! gh run download "${RUN_ID}" --name interaction-review --dir "${DOWNLOAD_DIR}"; then
              echo "no interaction-review artifact on run ${RUN_ID}; nothing to post"
              echo "found=false" >>"${GITHUB_OUTPUT}"
              exit 0
          fi
          if [ ! -s "${DOWNLOAD_DIR}/comment.md" ]; then
              echo "artifact has no comment body; nothing to post"
              echo "found=false" >>"${GITHUB_OUTPUT}"
              exit 0
          fi
          pr="$(tr -d '[:space:]' <"${DOWNLOAD_DIR}/pr-number.txt" || true)"
          if ! [[ "${pr}" =~ ^[0-9]+$ ]]; then
              # workflow_dispatch runs carry no PR number, which is not an error.
              echo "no PR number in the artifact; nothing to post"
              echo "found=false" >>"${GITHUB_OUTPUT}"
              exit 0
          fi
          echo "found=true" >>"${GITHUB_OUTPUT}"
          echo "pr=${pr}" >>"${GITHUB_OUTPUT}"

      - name: Post or update the comment
        if: ${{ steps.download.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.download.outputs.pr }}
        run: |
          # Match on the marker rather than on author + "last comment", so an
          # unrelated bot comment is never overwritten.
          existing="$(gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
              --jq "[.[] | select(.body | contains(\"${MARKER}\")) | .id] | first // empty")"
          if [ -n "${existing}" ]; then
              echo "updating comment ${existing} on #${PR}"
              gh api -X PATCH "repos/${GH_REPO}/issues/comments/${existing}" \
                  -F "body=@${DOWNLOAD_DIR}/comment.md" --silent
          else
              echo "creating a comment on #${PR}"
              gh api -X POST "repos/${GH_REPO}/issues/${PR}/comments" \
                  -F "body=@${DOWNLOAD_DIR}/comment.md" --silent
          fi
