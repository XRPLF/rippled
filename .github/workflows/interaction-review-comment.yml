# Posts (or updates) the advisory comment produced by `interaction-review.yml`.
#
# Runs on `workflow_run` so it executes from the base repository with write
# access to pull requests, while never checking out or executing PR code. Its
# only input is the `interaction-review` artifact: a rendered markdown body and
# the PR number it belongs to.
#
# An existing comment is found by its HTML marker and rewritten in place, so a
# PR carries one comment that is kept current rather than one comment per push.

name: Feature-interaction review comment

on:
  workflow_run:
    workflows: ["Feature-interaction review"]
    types: [completed]

defaults:
  run:
    shell: bash

env:
  MARKER: "<!-- interaction-review -->"
  DOWNLOAD_DIR: /tmp/interaction-review

jobs:
  post:
    name: Post the advisory comment
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # Read the triggering run's artifact; write the comment. No contents write.
      actions: read
      pull-requests: write
    steps:
      - name: Download the report
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          mkdir -p "${DOWNLOAD_DIR}"
          if ! gh run download "${RUN_ID}" --name interaction-review --dir "${DOWNLOAD_DIR}"; then
              echo "no interaction-review artifact on run ${RUN_ID}; nothing to post"
              echo "found=false" >>"${GITHUB_OUTPUT}"
              exit 0
          fi
          if [ ! -s "${DOWNLOAD_DIR}/comment.md" ]; then
              echo "artifact has no comment body; nothing to post"
              echo "found=false" >>"${GITHUB_OUTPUT}"
              exit 0
          fi
          if ! head -n 1 "${DOWNLOAD_DIR}/comment.md" | grep -Fqx "${MARKER}"; then
              echo "comment body does not start with the interaction-review marker" >&2
              exit 1
          fi
          bytes="$(wc -c <"${DOWNLOAD_DIR}/comment.md")"
          if [ "${bytes}" -gt 65536 ]; then
              echo "comment body is too large for GitHub (${bytes} bytes)" >&2
              exit 1
          fi

          artifact_pr="$(tr -d '[:space:]' <"${DOWNLOAD_DIR}/pr-number.txt" || true)"
          case "${RUN_EVENT}" in
              pull_request)
                  # The workflow_run payload is trusted; the artifact came from
                  # code checked out from the PR and may not choose its target.
                  pr="${RUN_PR}"
                  if ! [[ "${pr}" =~ ^[0-9]+$ ]] || [ "${artifact_pr}" != "${pr}" ]; then
                      echo "artifact PR ${artifact_pr:-none} does not match run PR ${pr:-none}" >&2
                      exit 1
                  fi
                  ;;
              issue_comment)
                  # issue_comment workflows execute the default branch's trusted
                  # workflow file, whose resolve job writes this value.
                  pr="${artifact_pr}"
                  ;;
              *)
                  # workflow_dispatch runs carry no PR number, which is not an error.
                  echo "run event ${RUN_EVENT} has no PR target; nothing to post"
                  echo "found=false" >>"${GITHUB_OUTPUT}"
                  exit 0
                  ;;
          esac
          if ! [[ "${pr}" =~ ^[0-9]+$ ]]; then
              echo "invalid PR number ${pr:-none}" >&2
              exit 1
          fi

          analyzed_head="$(jq -r '.head // empty' "${DOWNLOAD_DIR}/selected.json")"
          current_head="$(gh api "repos/${GH_REPO}/pulls/${pr}" --jq '.head.sha')"
          if [[ "${analyzed_head}" =~ ^[0-9a-f]{40}$ ]] &&
             [ "${analyzed_head}" != "${current_head}" ]; then
              echo "run analyzed stale head ${analyzed_head}; current PR head is ${current_head}"
              echo "found=false" >>"${GITHUB_OUTPUT}"
              exit 0
          fi
          echo "found=true" >>"${GITHUB_OUTPUT}"
          echo "pr=${pr}" >>"${GITHUB_OUTPUT}"

      - name: Post or update the comment
        if: ${{ steps.download.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.download.outputs.pr }}
        run: |
          # Match both the marker and this app's author. A user can paste the
          # marker into a discussion comment, and the token cannot edit it.
          existing="$(gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
              --jq "[.[] | select(.user.login == \"github-actions[bot]\" and \
                  (.body | contains(\"${MARKER}\"))) | .id] | first // empty")"
          if [ -n "${existing}" ]; then
              echo "updating comment ${existing} on #${PR}"
              gh api -X PATCH "repos/${GH_REPO}/issues/comments/${existing}" \
                  -F "body=@${DOWNLOAD_DIR}/comment.md" --silent
          else
              echo "creating a comment on #${PR}"
              gh api -X POST "repos/${GH_REPO}/issues/${PR}/comments" \
                  -F "body=@${DOWNLOAD_DIR}/comment.md" --silent
          fi
