name: Generate strategy matrix

on:
  workflow_call:
    inputs:
      os:
        description: 'The operating system to use for the build ("linux", "macos", "windows", or empty for all).'
        required: false
        type: string
    outputs:
      matrix:
        description: "The generated strategy matrix."
        value: ${{ jobs.generate-matrix.outputs.matrix }}

defaults:
  run:
    shell: bash

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Test the matrix generator
        working-directory: .github/scripts/strategy-matrix
        run: ./test_generate.py

      - name: Generate strategy matrix
        working-directory: .github/scripts/strategy-matrix
        id: generate
        env:
          GENERATE_CONFIG: ${{ inputs.os != '' && format('--config={0}', inputs.os) || '' }}
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REF_TYPE: ${{ github.ref_type }}
        run: ./generate.py ${GENERATE_CONFIG} --event="${EVENT}" --labels="${LABELS}" --ref-type="${REF_TYPE}" >>"${GITHUB_OUTPUT}"
