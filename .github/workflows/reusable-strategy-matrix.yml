name: Generate strategy matrix

on:
  workflow_call:
    inputs:
      os:
        description: 'The operating system to use for the build ("linux", "macos", "windows", or empty for all).'
        required: false
        type: string
    outputs:
      matrix:
        description: "The generated strategy matrix."
        value: ${{ jobs.generate-matrix.outputs.matrix }}

defaults:
  run:
    shell: bash

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    # Set at job level rather than on the step, so that the generate step and the
    # check after it read the same values and cannot disagree.
    env:
      GENERATE_CONFIG: ${{ inputs.os != '' && format('--config={0}', inputs.os) || '' }}
      # Pick the smallest matrix for a pull request not yet labeled "Ready to
      # merge" or "Full CI build", the largest for the nightly schedule or a
      # manual run (otherwise the only way to exercise it is to wait for the
      # night), and generate.py's own default, ready_to_merge, for anything
      # else (merge queue, push).
      GENERATE_EVENT: >-
        ${{
          (github.event_name == 'pull_request'
            && !contains(github.event.pull_request.labels.*.name, 'Ready to merge')
            && !contains(github.event.pull_request.labels.*.name, 'Full CI build'))
          && '--event=pull_request'
          || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
            && '--event=schedule'
            || '')
        }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Generate strategy matrix
        working-directory: .github/scripts/strategy-matrix
        id: generate
        run: ./generate.py ${GENERATE_CONFIG} ${GENERATE_EVENT} >>"${GITHUB_OUTPUT}"

      # generate.py checks that the schedule matrix holds every config that
      # declares it, but it never sees the event, so it cannot tell whether
      # this run asked for that matrix. A GENERATE_EVENT that stops matching
      # the events would drop those configs and fail nothing, because CI runs
      # only the jobs the matrix names. So compare what was generated against
      # the schedule matrix, on the events that must produce it.
      - name: Check the schedule configs reached the matrix
        if: ${{ env.GENERATE_EVENT == '--event=schedule' }}
        working-directory: .github/scripts/strategy-matrix
        env:
          GENERATED: ${{ steps.generate.outputs.matrix }}
        run: |
          expected="$(./generate.py ${GENERATE_CONFIG} --event=schedule)"
          if [[ "matrix=${GENERATED}" != "${expected}" ]]; then
              echo "::error::the ${GITHUB_EVENT_NAME} matrix is not the schedule one"
              exit 1
          fi
