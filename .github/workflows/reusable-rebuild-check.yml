# Rebuild every packaged config with bin/rebuild-release.sh, the way an outside
# party checks a release: another path, another Conan home, every dependency
# built from source and no CI environment. Fails if any binary differs from the
# one the build job of the same workflow run uploaded.
name: Rebuild check

on:
  workflow_call:

defaults:
  run:
    shell: bash

env:
  CI_DIR: ci-binaries

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Generate packaging matrix
        id: generate
        working-directory: .github/scripts/strategy-matrix
        run: ./generate.py --packaging | grep '^matrix=' >>"${GITHUB_OUTPUT}"

  rebuild:
    needs: [generate-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    name: "rebuild ${{ matrix.config_name }}"
    permissions:
      contents: read
    runs-on: ["self-hosted", "Linux", "X64", "heavy"]
    container: ${{ matrix.build_image }}
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rebuild from source
        env:
          CONFIG_NAME: ${{ matrix.config_name }}
        run: ./bin/rebuild-release.sh "${CONFIG_NAME}" "${RUNNER_TEMP}/rebuild-check/${CONFIG_NAME}"

      - name: Download the build job's xrpld binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.xrpld_artifact_name }}
          path: ${{ env.CI_DIR }}

      - name: Download the build job's validator-keys binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.validator_keys_artifact_name }}
          path: ${{ env.CI_DIR }}

      - name: Compare with the build job's binaries
        env:
          CONFIG_NAME: ${{ matrix.config_name }}
        run: |
          rebuilt="${RUNNER_TEMP}/rebuild-check/${CONFIG_NAME}/out"
          status=0
          for file in xrpld validator-keys validator-keys-LICENSE; do
              ci_hash="$(sha256sum "${CI_DIR}/${file}" | cut -d' ' -f1)"
              rebuilt_hash="$(sha256sum "${rebuilt}/${file}" | cut -d' ' -f1)"
              echo "${file}: CI ${ci_hash}, rebuilt ${rebuilt_hash}"
              if [[ "${ci_hash}" != "${rebuilt_hash}" ]]; then
                  echo "::error::${file} differs between the build job and the rebuild"
                  status=1
              fi
          done
          exit "${status}"

      - name: Upload the rebuilt binaries
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.xrpld_artifact_name }}-rebuild
          path: ${{ runner.temp }}/rebuild-check/${{ matrix.config_name }}/out/
          if-no-files-found: warn
