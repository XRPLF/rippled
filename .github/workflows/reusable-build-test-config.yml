name: Build and test configuration

on:
  workflow_call:
    inputs:
      benchmark:
        description: "Whether to smoke-run the benchmarks after testing."
        required: false
        type: boolean
        default: false

      build_only:
        description: 'Whether to only build or to build and test the code ("true", "false").'
        required: true
        type: boolean

      build_type:
        description: 'The build type to use ("Debug", "Release").'
        required: true
        type: string

      ccache_enabled:
        description: "Whether to enable ccache."
        required: false
        type: boolean
        default: false

      cmake_args:
        description: "Additional arguments to pass to CMake."
        required: false
        type: string
        default: ""

      cmake_target:
        description: "The CMake target to build."
        required: true
        type: string

      runs_on:
        description: Runner to run the job on as a JSON string
        required: true
        type: string

      image:
        description: "The image to run in (leave empty to run natively)"
        required: true
        type: string

      config_name:
        description: "The configuration string (used for naming artifacts and such)."
        required: true
        type: string

      nproc_subtract:
        description: "The number of processors to subtract when calculating parallelism."
        required: false
        type: number
        default: 2

      sanitizers:
        description: "The sanitizers to enable."
        required: false
        type: string
        default: ""

      compiler:
        description: 'The compiler to use ("gcc" or "clang"). Leave empty for macOS/Windows (uses system default).'
        required: false
        type: string
        default: ""

      toolchain:
        description: 'Where the toolchain comes from ("nix" to build the flake CI environment on the runner, empty for the system one). macOS only: Linux always builds in a Nix image, and Nix has no Windows support.'
        required: false
        type: string
        default: ""

    secrets:
      CODECOV_TOKEN:
        description: "The Codecov token to use for uploading coverage reports."
        required: true

defaults:
  run:
    shell: bash

env:
  # Conan installs the generators in the build/generators directory, see the
  # layout() method in conanfile.py. We then run CMake from the build directory.
  BUILD_DIR: build

jobs:
  build-and-test:
    name: ${{ inputs.config_name }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    container: ${{ inputs.image != '' && inputs.image || null }}
    timeout-minutes: ${{ inputs.sanitizers != '' && 360 || 180 }}
    env:
      # Use a namespace to keep the objects separate for each configuration.
      CCACHE_NAMESPACE: ${{ inputs.config_name }}
      # Ccache supports both Redis and HTTP endpoints.
      # * For Redis, use the following format: redis://ip:port, see
      #   https://github.com/ccache/ccache/wiki/Redis-storage. Note that TLS is
      #   not directly supported by ccache, and requires use of a proxy.
      # * For HTTP use the following format: http://ip:port/cache when using
      #   nginx as backend or http://ip:port|layout=bazel when using Bazel
      #   Remote Cache, see https://github.com/ccache/ccache/wiki/HTTP-storage.
      #   Note that HTTPS is not directly supported by ccache.
      CCACHE_REMOTE_ONLY: true
      CCACHE_REMOTE_STORAGE: http://cache.dev.ripplex.io:8080|layout=bazel
      # Ignore the creation and modification timestamps on files, since the
      # header files are copied into separate directories by CMake, which will
      # otherwise result in cache misses.
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime
      # Determine if coverage, voidstar and validator-keys should be enabled.
      COVERAGE_ENABLED: ${{ contains(inputs.cmake_args, '-Dcoverage=ON') }}
      VOIDSTAR_ENABLED: ${{ contains(inputs.cmake_args, '-Dvoidstar=ON') }}
      VALIDATOR_KEYS_ENABLED: ${{ contains(inputs.cmake_args, '-Dvalidator_keys=ON') }}
      SANITIZERS_ENABLED: ${{ inputs.sanitizers != '' }}
      # One flag per sanitizer, so that a step needing only one of them does not
      # have to parse the list. conan/profiles/sanitizers rejects any name that is
      # not one of these three, so an unrecognized one never reaches a step.
      ASAN_ENABLED: ${{ contains(inputs.sanitizers, 'address') }}
      TSAN_ENABLED: ${{ contains(inputs.sanitizers, 'thread') }}
      UBSAN_ENABLED: ${{ contains(inputs.sanitizers, 'undefinedbehavior') }}
      # The binaries reusable-package.yml consumes. A private repository skips
      # them except on a tag push, which is what produces its release packages.
      PACKAGING_ARTIFACTS_ENABLED: ${{ github.event.repository.visibility == 'public' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Cleanup workspace (macOS and Windows)
        if: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
        uses: XRPLF/actions/cleanup-workspace@c7d9ce5ebb03c752a354889ecd870cadfc2b1cd4

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare runner
        uses: XRPLF/actions/prepare-runner@b3e255d74d785d053e4903da8ac90983cd7d9e82
        with:
          enable_ccache: ${{ inputs.ccache_enabled }}

      # Before any step that uses a build tool, composite actions included.
      - name: Setup Nix environment
        if: ${{ inputs.toolchain == 'nix' }}
        uses: ./.github/actions/setup-nix-env

      - name: Set ccache log file
        if: ${{ inputs.ccache_enabled && runner.debug == '1' }}
        run: echo "CCACHE_LOGFILE=${{ runner.temp }}/ccache.log" >>"${GITHUB_ENV}"

      - name: Check tools
        env:
          CHECK_TOOLS_SKIP_CLONE: "1"
        run: ./bin/check-tools.sh || true

      - name: Print build environment
        uses: XRPLF/actions/print-build-env@59dec886e4afb05a1724443af08baccbc045b574

      - name: Get number of processors
        uses: XRPLF/actions/get-nproc@cf0433aa74563aead044a1e395610c96d65a37cf
        id: nproc
        with:
          subtract: ${{ inputs.nproc_subtract }}

      - name: Set compiler environment (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/set-compiler-env
        with:
          compiler: ${{ inputs.compiler }}

      - name: Use cargo artifacts cache
        uses: ./.github/actions/cargo-cache
        with:
          cache-directories: ${{ env.BUILD_DIR }}/corrosion
          key: ${{ inputs.config_name }}
          # two workspaces here because build artifacts are located in 2 places:
          # - crates/target when cargo is called directly
          # - build/cargo when cargo is called by cmake
          workspaces: |
            crates
            crates -> ${{ runner.os == 'Windows' && format('../{0}/x64/{1}/cargo', env.BUILD_DIR, inputs.build_type) || format('../{0}/cargo', env.BUILD_DIR) }}

      # `setup-nix-env` already did this for the Nix toolchain.
      - name: Setup Conan
        if: ${{ inputs.toolchain != 'nix' }}
        env:
          SANITIZERS: ${{ inputs.sanitizers }}
        uses: ./.github/actions/setup-conan

      - name: Build dependencies
        uses: ./.github/actions/build-deps
        with:
          build_nproc: ${{ steps.nproc.outputs.nproc }}
          build_type: ${{ inputs.build_type }}
          # Set the verbosity to "quiet" for Windows to avoid an excessive
          # amount of logs. For other OSes, the "verbose" logs are more useful.
          log_verbosity: ${{ runner.os == 'Windows' && 'quiet' || 'verbose' }}
          sanitizers: ${{ inputs.sanitizers }}

      - name: Configure CMake
        working-directory: ${{ env.BUILD_DIR }}
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          CMAKE_ARGS: ${{ inputs.cmake_args }}
        run: |
          cmake \
              -G '${{ runner.os == 'Windows' && 'Visual Studio 18 2026' || 'Ninja' }}' \
              -DCMAKE_TOOLCHAIN_FILE:FILEPATH=build/generators/conan_toolchain.cmake \
              -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
              ${CMAKE_ARGS} \
              ..

      # Export the sanitizer options before any instrumented binary runs. The
      # build step below invokes instrumented dependency tools (protoc, grpc),
      # so setting UBSAN_OPTIONS here lets the UBSan suppression list silence
      # their diagnostics too, not just at test time.
      # GITHUB_WORKSPACE (not the github.workspace context) is used so the path
      # resolves correctly inside the container job.
      - name: Set sanitizer options
        if: ${{ !inputs.build_only && env.SANITIZERS_ENABLED == 'true' }}
        env:
          CONFIG_NAME: ${{ inputs.config_name }}
        run: |
          SUPP="${GITHUB_WORKSPACE}/sanitizers/suppressions"
          ASAN_OPTS="include=${SUPP}/runtime-asan-options.txt:suppressions=${SUPP}/asan.supp"
          if [[ "${CONFIG_NAME}" == *gcc* ]]; then
              ASAN_OPTS="${ASAN_OPTS}:alloc_dealloc_mismatch=0"
          fi
          echo "ASAN_OPTIONS=${ASAN_OPTS}" >>${GITHUB_ENV}
          # exitcode=0 is set here rather than in runtime-tsan-options.txt,
          # because that file is also what the documented local command reads,
          # and a local run must still exit nonzero on a finding. TSan exits 66
          # on its own once it has reported anything, which would fail the job.
          TSAN_OPTS="include=${SUPP}/runtime-tsan-options.txt:suppressions=${SUPP}/tsan.supp"
          echo "TSAN_OPTIONS=${TSAN_OPTS}:exitcode=0" >>${GITHUB_ENV}
          echo "UBSAN_OPTIONS=include=${SUPP}/runtime-ubsan-options.txt:suppressions=${SUPP}/ubsan.supp" >>${GITHUB_ENV}
          echo "LSAN_OPTIONS=include=${SUPP}/runtime-lsan-options.txt:suppressions=${SUPP}/lsan.supp" >>${GITHUB_ENV}

      - name: Build the binary
        working-directory: ${{ env.BUILD_DIR }}
        env:
          BUILD_NPROC: ${{ steps.nproc.outputs.nproc }}
          BUILD_TYPE: ${{ inputs.build_type }}
          CMAKE_TARGET: ${{ inputs.cmake_target }}
        run: |
          set -o pipefail
          cmake \
              --build . \
              --config "${BUILD_TYPE}" \
              --parallel "${BUILD_NPROC}" \
              --target "${CMAKE_TARGET}" \
              2>&1 | tee "${GITHUB_WORKSPACE}/build.log"

      # Nothing may reference the store, so whole trees are checked - the Conan
      # cache included, since what it holds is what gets uploaded and reused.
      - name: Check the build output for Nix store references (Nix toolchain)
        if: ${{ inputs.toolchain == 'nix' }}
        run: ./bin/check-nix-store-refs.sh "${BUILD_DIR}"

      - name: Check the Conan cache for Nix store references (Nix toolchain)
        if: ${{ inputs.toolchain == 'nix' }}
        run: ./bin/check-nix-store-refs.sh "${CONAN_HOME}"

      # Only what PatchNixBinary.cmake retargets: the toolchain in the Linux
      # images always references the store. Same condition it uses.
      - name: Check for Nix store references (Linux)
        if: ${{ runner.os == 'Linux' && env.SANITIZERS_ENABLED == 'false' }}
        run: |
          ./bin/check-nix-store-refs.sh "${BUILD_DIR}/xrpld"
          ./bin/check-nix-store-refs.sh "${BUILD_DIR}/xrpl_tests"

      - name: Show ccache statistics
        if: ${{ inputs.ccache_enabled }}
        run: |
          ccache --show-stats -vv
          if [ '${{ runner.debug }}' = '1' ]; then
              cat "${CCACHE_LOGFILE}"
              curl ${CCACHE_REMOTE_STORAGE%|*}/status || true
          fi

      - name: Upload the binary (Linux)
        if: ${{ env.PACKAGING_ARTIFACTS_ENABLED == 'true' && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xrpld-${{ inputs.config_name }}
          path: ${{ env.BUILD_DIR }}/xrpld
          retention-days: 3
          if-no-files-found: error

      - name: Run the validator-keys tests
        if: ${{ env.VALIDATOR_KEYS_ENABLED == 'true' }}
        working-directory: ${{ env.BUILD_DIR }}
        run: ./validator-keys --unittest

      - name: Upload the validator-keys binary
        if: ${{ env.PACKAGING_ARTIFACTS_ENABLED == 'true' && env.VALIDATOR_KEYS_ENABLED == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validator-keys-${{ inputs.config_name }}
          path: |
            ${{ env.BUILD_DIR }}/validator-keys
            ${{ env.BUILD_DIR }}/validator-keys-LICENSE
          retention-days: 3
          if-no-files-found: error

      - name: Upload the test binary (Linux)
        if: ${{ github.event.repository.visibility == 'public' && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xrpl_tests-${{ inputs.config_name }}
          path: ${{ env.BUILD_DIR }}/xrpl_tests
          retention-days: 3
          if-no-files-found: error

      - name: Export server definitions
        if: ${{ runner.os != 'Windows' && !inputs.build_only && env.VOIDSTAR_ENABLED != 'true' }}
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -o pipefail
          ./xrpld --definitions | python3 -m json.tool >server_definitions.json

      - name: Upload server definitions
        if: ${{ github.event.repository.visibility == 'public' && inputs.config_name == 'ubuntu-gcc-debug-amd64-coverage' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-definitions
          path: ${{ env.BUILD_DIR }}/server_definitions.json
          retention-days: 3
          if-no-files-found: error

      - name: Check linking (Linux)
        if: ${{ runner.os == 'Linux' && env.SANITIZERS_ENABLED == 'false' }}
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          ldd ./xrpld
          if [ "$(ldd ./xrpld | grep -E '(libstdc\+\+|libgcc)' | wc -l)" -eq 0 ]; then
              echo 'The binary is statically linked.'
          else
              echo 'The binary is dynamically linked.'
              exit 1
          fi

      # Catch a build configured without the instrumentation it was asked for,
      # which would otherwise run every test, pass, and report nothing.
      #
      # A sanitizer is checked by the symbols the binary carries, because
      # instrumented code calls into its runtime, so those references are present
      # whether the runtime is linked statically or as a shared library. That is
      # what proves the -fsanitize flags reached the compiler. The version string
      # cannot: cmake sets the SANITIZERS macro separately from those flags, so it
      # names a sanitizer in a binary carrying none. It is checked as well, on top
      # rather than instead, because BuildInfo.cpp is what a bug report quotes and
      # it should agree with the binary.
      #
      # Asking each runtime to print its flag list was tried and dropped: GCC's
      # libubsan ignores UBSAN_OPTIONS=help=1, so it called an instrumented gcc
      # UBSan build uninstrumented.
      #
      # voidstar is a linked library rather than instrumentation, so the version
      # string is all there is to check for it.
      #
      # The version call's exit code is ignored on purpose. ASan leaves leak
      # reporting on and UBSan sets halt_on_error, either of which can end it
      # nonzero on a healthy binary. Only the text decides, and it is printed.
      - name: Verify presence of instrumentation (Linux)
        if: ${{ runner.os == 'Linux' && (env.VOIDSTAR_ENABLED == 'true' || env.SANITIZERS_ENABLED == 'true') }}
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          version="$(./xrpld --version 2>&1 || true)"
          echo "${version}"
          status=0

          named() {
              if grep -q "$2" <<<"${version}"; then
                  echo "${1}: the version string names '${2}'."
              else
                  echo "${1} is enabled, but the version string does not name '${2}'."
                  status=1
              fi
          }

          if [ "${SANITIZERS_ENABLED}" = 'true' ]; then
              # Whichever of these the image ships. Stopping here beats a check
              # that quietly stops checking.
              symbols="$(mktemp)"
              if command -v nm >/dev/null 2>&1; then
                  nm ./xrpld >"${symbols}" 2>/dev/null || true
              elif command -v readelf >/dev/null 2>&1; then
                  readelf -sW ./xrpld >"${symbols}" 2>/dev/null || true
              elif command -v objdump >/dev/null 2>&1; then
                  objdump -t ./xrpld >"${symbols}" 2>/dev/null || true
              else
                  echo 'Found none of nm, readelf or objdump, so the binary cannot be inspected.'
                  exit 1
              fi
              if [ ! -s "${symbols}" ]; then
                  echo 'Read no symbols from ./xrpld, so the instrumentation cannot be confirmed.'
                  exit 1
              fi

              # Each pattern names the calls a sanitizer plants at an instrumented
              # operation, rather than the ones that only prove its runtime is
              # present. __asan_init and __tsan_init appear as soon as the flags
              # reach the linker, so matching those would pass a build whose
              # compile step never saw them. __tsan_func_entry is no better: it
              # survives an ignorelist, while the read and write calls do not.
              #
              # How much this buys depends on how the runtime is linked, and both
              # kinds are in the matrix. GCC links libasan and libubsan
              # dynamically, so an instrumented call site is the only thing that
              # can put these symbols in the binary. Clang links the TSan runtime
              # statically, so the runtime's own definitions are there either way
              # and this narrows to a check that the sanitizer reached the link.
              # Nothing cheap distinguishes the two cases, and the flags come from
              # one cmake variable, so losing only the compile half is unlikely.
              instrumented() {
                  if grep -qE "$2" "${symbols}"; then
                      echo "${1}: the binary calls into its runtime, matching '${2}'."
                  else
                      echo "${1} is enabled, but no instrumented call site matches '${2}'."
                      status=1
                  fi
              }

              [ "${ASAN_ENABLED}" = 'true' ] &&
                  instrumented address '__asan_report|__asan_memcpy|__asan_stack_malloc'
              [ "${TSAN_ENABLED}" = 'true' ] &&
                  instrumented thread '__tsan_read|__tsan_write|__tsan_atomic'
              [ "${UBSAN_ENABLED}" = 'true' ] &&
                  instrumented undefinedbehavior '__ubsan_handle'
          fi

          [ "${VOIDSTAR_ENABLED}" = 'true' ] && named voidstar libvoidstar
          [ "${ASAN_ENABLED}" = 'true' ] && named address ASAN
          [ "${TSAN_ENABLED}" = 'true' ] && named thread TSAN
          [ "${UBSAN_ENABLED}" = 'true' ] && named undefinedbehavior UBSAN

          exit "${status}"

      - name: Run the separate tests
        if: ${{ !inputs.build_only }}
        working-directory: ${{ runner.os == 'Windows' && format('{0}/{1}', env.BUILD_DIR, inputs.build_type) || env.BUILD_DIR }}
        run: ./xrpl_tests

      - name: Run the embedded tests
        if: ${{ !inputs.build_only }}
        working-directory: ${{ runner.os == 'Windows' && format('{0}/{1}', env.BUILD_DIR, inputs.build_type) || env.BUILD_DIR }}
        env:
          BUILD_NPROC: ${{ steps.nproc.outputs.nproc }}
        run: |
          set -o pipefail
          # Coverage builds are slower due to instrumentation; use fewer parallel jobs to avoid flakiness
          [ "$COVERAGE_ENABLED" = "true" ] && BUILD_NPROC=$((BUILD_NPROC - 2))

          # TSan keeps shadow memory for every byte a process touches, so each job
          # costs several times what it does uninstrumented, and too many at once
          # exhausts the machine. Cap the count rather than subtract from it,
          # because the ceiling is total memory and does not scale with the core
          # count. Raise it only against a run, and expect one of two failures:
          # the OOM killer ends the process with code 137 before any suite
          # finishes, or, worse, the runner loses contact with the server and the
          # job stops with no log and no failing step.
          [ "$TSAN_ENABLED" = "true" ] && BUILD_NPROC=4

          # The resolver/preload workaround is only correct for the ASan build:
          # a regular build doesn't hit the __dn_expand interceptor bug, and must
          # NOT have libasan injected. So only preload when xrpld is ASan-built.
          #
          # libresolv hosts getaddrinfo's resolver helpers (dn_expand, res_*). Under ASan
          # these are intercepted via dlsym(RTLD_NEXT, ...), which yields a NULL pointer
          # and crashes DNS resolution if libresolv isn't loaded. Linking it guarantees
          # the symbols are present; it's a harmless no-op on glibc >= 2.34 (merged into
          # libc) and is what the compiler driver already does for sanitizer builds.
          #   https://github.com/llvm/llvm-project/issues/59007
          #   https://github.com/google/sanitizers/issues/1592
          if ldd ./xrpld | grep -q libasan; then
              PRELOAD="$(gcc -print-file-name=libasan.so):/usr/lib/x86_64-linux-gnu/libresolv.so.2"
          else
              PRELOAD=""
          fi

          LD_PRELOAD="$PRELOAD" ./xrpld --unittest --unittest-jobs "${BUILD_NPROC}" 2>&1 | tee "${GITHUB_WORKSPACE}/unittest.log"

      - name: Run Rust tests
        if: ${{ !inputs.build_only }}
        working-directory: crates
        run: cargo nextest run --workspace --all-features --locked --no-tests=warn

      # Smoke-run every benchmark module with a single repetition to confirm the
      # benchmarks still build and execute. This is a correctness check, not a
      # performance measurement, so there is nothing to gain from repeating it
      # across configurations: it is opted into by a single config in the
      # strategy matrix (see the 'benchmark' flag in the JSON files), which
      # keeps it off instrumented builds (sanitizers/coverage/voidstar), where
      # it would be slow and meaningless, off Debug builds, where it is much
      # slower, and off Windows, where the `install` target does not build them.
      - name: Run the benchmarks
        if: ${{ inputs.benchmark }}
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          rc=0
          while IFS= read -r bench; do
              echo "::group::${bench}"
              "./${bench}" --benchmark_repetitions=1 || rc=1
              echo "::endgroup::"
          done < <(find src/benchmarks -type f -perm -u+x -name 'xrpl.bench.*')
          exit "${rc}"

      - name: Show build/test failure summary
        if: ${{ failure() }}
        run: |
          cd "${GITHUB_WORKSPACE}"

          if [ -f unittest.log ]; then
              if ! grep -E "failed" unittest.log | grep -vE "^I[0-9]|^[0-9]+> (ERR:|FTL:)"; then
                  echo "unittest.log present but no failure lines found."
              fi
          elif [ -f build.log ]; then
              # GCC/Clang emit "error:" (covers "fatal error:"); MSVC emits
              # "error C####:", "error LNK####:", and "fatal error LNK####:".
              # -A6 prints the lines that follow each match (source line, caret,
              # notes, and the "N errors generated" tally) to capture the whole
              # diagnostic block.
              if ! grep -E -A6 "error:|error C[0-9]{4}|error LNK[0-9]{4}|fatal error" build.log; then
                  echo "build.log present but no compile errors found."
              fi
          else
              echo "unittest.log/build.log not found; something went wrong."
              exit 1
          fi
      - name: Debug failure (Linux)
        if: ${{ failure() && runner.os == 'Linux' && !inputs.build_only }}
        run: |
          echo "IPv4 local port range:"
          cat /proc/sys/net/ipv4/ip_local_port_range
          echo "Netstat:"
          netstat -an

      - name: Prepare coverage report
        if: ${{ !inputs.build_only && env.COVERAGE_ENABLED == 'true' }}
        working-directory: ${{ env.BUILD_DIR }}
        env:
          BUILD_NPROC: ${{ steps.nproc.outputs.nproc }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          cmake \
              --build . \
              --config "${BUILD_TYPE}" \
              --parallel "${BUILD_NPROC}" \
              --target coverage

      - name: Upload coverage report
        if: ${{ github.repository_owner == 'XRPLF' && !inputs.build_only && env.COVERAGE_ENABLED == 'true' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          disable_telem: true
          fail_ci_if_error: true
          files: ${{ env.BUILD_DIR }}/coverage.xml
          flags: cpp
          plugins: noop
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
