# This workflow exports the built libxrpl package to the Conan remote.
name: Upload Conan recipe

# This workflow can only be triggered by other workflows.
on:
  workflow_call:
    inputs:
      remote_name:
        description: "The name of the Conan remote to use."
        required: false
        type: string
        default: xrplf
      remote_url:
        description: "The URL of the Conan endpoint to use."
        required: false
        type: string
        default: https://conan.xrplf.org/repository/conan/

    secrets:
      remote_username:
        description: "The username for logging into the Conan remote."
        required: true
      remote_password:
        description: "The password for logging into the Conan remote."
        required: true

    outputs:
      recipe_ref:
        description: "The Conan recipe reference ('name/version') that was uploaded."
        value: ${{ jobs.upload.outputs.ref }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-upload-recipe
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  upload:
    runs-on: ubuntu-latest
    container: ghcr.io/xrplf/xrpld/nix-ubuntu:sha-ed96e60
    env:
      REMOTE_NAME: ${{ inputs.remote_name }}
      CONAN_LOGIN_USERNAME_XRPLF: ${{ secrets.remote_username }}
      CONAN_PASSWORD_XRPLF: ${{ secrets.remote_password }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare runner
        uses: XRPLF/actions/prepare-runner@b3e255d74d785d053e4903da8ac90983cd7d9e82
        with:
          enable_ccache: false

      - name: Determine release info
        id: release_info
        uses: ./.github/actions/release-info

      - name: Set up Conan
        uses: ./.github/actions/setup-conan
        with:
          remote_name: ${{ inputs.remote_name }}
          remote_url: ${{ inputs.remote_url }}

      - name: Log into Conan remote
        run: conan remote login "${REMOTE_NAME}" "${CONAN_LOGIN_USERNAME_XRPLF}" --password "${CONAN_PASSWORD_XRPLF}"

      - name: Upload Conan recipe (version)
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          conan export . --version="${VERSION}"
          conan upload --confirm --check --remote="${REMOTE_NAME}" "xrpl/${VERSION}"

      - name: Upload Conan recipe (develop)
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          conan export . --version=develop
          conan upload --confirm --check --remote="${REMOTE_NAME}" xrpl/develop

    outputs:
      ref: xrpl/${{ steps.release_info.outputs.version }}
