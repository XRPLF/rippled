codecov:
  require_ci_to_pass: true
  # The C++ and Rust uploads land minutes apart; without this gate Codecov
  # publishes a near-zero total from whichever one arrives first.
  notify:
    after_n_builds: 2
    wait_for_ci: true

comment:
  behavior: default
  layout: reach,diff,flags,tree,reach
  show_carryforward_flags: true
  after_n_builds: 2

# C++ and Rust coverage upload from independent workflows under the `cpp` and
# `rust` flags; carryforward keeps one language's total when only the other reran.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: cpp
      carryforward: true
      paths:
        - include/
        - src/
    - name: rust
      carryforward: true
      paths:
        - crates/

coverage:
  range: "70..85"
  precision: 1
  round: nearest
  status:
    project:
      default:
        target: 75%
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 2%
    changes: false

github_checks:
  annotations: true

parsers:
  cobertura:
    partials_as_hits: true
    handle_missing_conditions: true

slack_app: false

ignore:
  - "src/test/"
  - "src/tests/"
  - "include/xrpl/beast/test/"
  - "include/xrpl/beast/unit_test/"
