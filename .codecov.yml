codecov:
  require_ci_to_pass: true

comment:
  behavior: default
  layout: reach,diff,flags,tree,reach
  show_carryforward_flags: true

# Coverage is uploaded from independent workflows: the C++ build under the `cpp`
# flag and the Rust build under the `rust` flag. Carrying forward each flag means
# a commit that only re-runs one language keeps the other language's last-known
# coverage instead of dropping it, so the combined project total stays stable.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: cpp
      carryforward: true
    - name: rust
      carryforward: true

coverage:
  range: "70..85"
  precision: 1
  round: nearest
  status:
    project:
      default:
        target: 75%
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 2%
    changes: false

github_checks:
  annotations: true

parsers:
  cobertura:
    partials_as_hits: true
    handle_missing_conditions: true

slack_app: false

ignore:
  - "src/test/"
  - "src/tests/"
  - "include/xrpl/beast/test/"
  - "include/xrpl/beast/unit_test/"
