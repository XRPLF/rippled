ignorePaths:
  - external/**
  - build/**
  - src/test/**
  - src/libxrpl/crypto
  - CMakeUserPresets.json
language: en
dictionaries:
  - cpp
  - en_US
  - en_GB
ignoreRegExpList:
  - /r[1-9A-HJ-NP-Za-km-z]{25,34}/g
  - /XRPL_[A-Z_]+_H_INCLUDED+/g
  - /XRPL_[A-Z_]+_H+/g
  - /BEAST_[A-Z_]+_H_INCLUDED+/g
  - /BEAST_[A-Z_]+_H+/g
  - /boost::[a-z:]+/g
  - /beast::[a-z:]+/g
  - /std::[a-z:]+/g
  - /sle[a-z]{1,3}/g
  - /[a-z]{1,3}obj/g
  - /lib[a-z]+/g
  - /https?:\/\/[^\s"'<>]+/g
  - /[0-9]{4}-[0-9]{2}-[0-9]{2}[,:]\s*[A-Za-z\s]+/g
  - /[0-9]{4}[,:]\s*[A-Za-z\s]+/g
  - /\[[A-Za-z0-9]+\]\(https:\/\/github.com\/[A-Za-z0-9]+\)/g
  - /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g
  - /-[DWw][a-zA-Z0-9_]+/g
