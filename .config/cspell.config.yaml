ignorePaths:
  - build/**
  - src/test/**
  - src/libxrpl/crypto
  - CMakeUserPresets.json
  - Doxyfile
language: en
dictionaries:
  - cpp
  - en_US
  - en_GB
ignoreRegExpList:
  - /[rs][1-9A-HJ-NP-Za-km-z]{25,34}/g # addresses and seeds
  - /XRPL_[A-Z_]+_H_INCLUDED+/g # include guards
  - /XRPL_[A-Z_]+_H+/g # include guards
  - /BEAST_[A-Z_]+_H_INCLUDED+/g # include guards
  - /BEAST_[A-Z_]+_H+/g # include guards
  - /::[a-z:]+/g # things from other namespaces
  - /sle[a-z]{1,3}/g # TODO: clean this up
  - /[a-z]{1,3}obj/g # TODO: clean this up
  - /lib[a-z]+/g # libraries
  - /https?:\/\/[^\s"'<>]+/g # URLs
  - /[0-9]{4}-[0-9]{2}-[0-9]{2}[,:]\s*[A-Za-z\s]+/g # copyright dates
  - /[0-9]{4}[,:]\s*[A-Za-z\s]+/g # copy right dates (years)
  - /\[[A-Za-z0-9]+\]\(https:\/\/github.com\/[A-Za-z0-9]+\)/g # Github links
  - /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g # emails
  - /-[DWw][a-zA-Z0-9_-]+=/g # compile flags
  - /'-[DWw][a-zA-Z0-9_-]+'/g # compile flags
