ignorePaths:
  - build/**
  - src/libxrpl/crypto
  - .git-blame-ignore-revs # commit titles cannot be edited
  - cmake/CodeCoverage.cmake # vendored from https://github.com/bilke/cmake-modules
  - CMakeUserPresets.json
  - Doxyfile
  - docs/**/*.puml
  - LICENSE.md
  - .clang-tidy
  - nix/check-tools/*.txt # generated, and full of Nix store hashes
language: en
ignoreRandomStrings: true
minWordLength: 5
dictionaries:
  - cpp
  - en_US
  - en-gb
ignoreRegExpList:
  - /\b[rs][1-9A-HJ-NP-Za-km-z]{25,34}/g # addresses and seeds
  - /\bC[A-Z0-9]{15}/g # CTIDs
  - /\b(XRPL|BEAST)_[A-Z_0-9]+_H_INCLUDED+/g # include guards
  - /\b(XRPL|BEAST)_[A-Z_0-9]+_H+/g # include guards
  - /::[a-z:_]+/g # things from other namespaces
  - /\blib[a-z]+/g # libraries
  - /\b[0-9]{4}-[0-9]{2}-[0-9]{2}[,:][A-Za-zÀ-ÖØ-öø-ÿ.\s]+/g # copyright dates
  - /\b[0-9]{4}[,:]?\s*[A-Za-zÀ-ÖØ-öø-ÿ.\s]+/g # copyright years
  - /\[[A-Za-z0-9-]+\]\(https:\/\/github.com\/[A-Za-z0-9-]+\)/g # Github usernames
  - /-[DWw][a-zA-Z0-9_-]+=/g # compile flags
  - /[\['"`]-[DWw][a-zA-Z0-9_-]+['"`\]]/g # compile flags
  - ABCDEFGHIJKLMNOPQRSTUVWXYZ
  - ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz
overrides:
  - filename:
      - "**/*_test.cpp" # legacy boost.test files
      - "src/tests/**/*.cpp" # gtest test files
    ignoreRegExpList:
      - /"[^"]*"/g # double-quoted strings
      - /'[^']*'/g # single-quoted strings
      - /`[^`]*`/g # backtick strings
  - filename: .github/scripts/strategy-matrix/linux.json
    words: [reffee]
suggestWords:
  - unsynched->unsynced
  - synched->synced
  - synch->sync
