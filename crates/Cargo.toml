[workspace]
members = [
    "xrpl-wasm-vm-ffi",
    "xrpl-wasm-vm",
    "xrpl-wasm-testkit",
    "xrpl-host-functions",
    "xrpl-host-functions-macros",
]
resolver = "3"

[workspace.dependencies]
cxx = { version = "1.0.199", features = ["c++20"] }

# Not for merge: builds against a wasmi fork with `ModuleInspector`
# (TimothyBanks/wasmi, branch `parser_callback`) until it is accepted upstream.
# All four crates come from the fork so that there is one `wasmi_core`.
[patch.crates-io]
wasmi = { git = "https://github.com/TimothyBanks/wasmi.git", branch = "parser_callback" }
wasmi_core = { git = "https://github.com/TimothyBanks/wasmi.git", branch = "parser_callback" }
wasmi_ir = { git = "https://github.com/TimothyBanks/wasmi.git", branch = "parser_callback" }
wasmi_collections = { git = "https://github.com/TimothyBanks/wasmi.git", branch = "parser_callback" }

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [ 'cfg(coverage)', 'cfg(coverage_nightly)' ] }

[profile.release]
opt-level = 3
overflow-checks = true
lto = true
codegen-units = 1
debug = true
