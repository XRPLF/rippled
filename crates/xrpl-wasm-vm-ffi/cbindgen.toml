# The C++ header for the ABI's wire enums and constants, generated by `build.rs` from
# `xrpl-host-functions`. cbindgen reads that crate's source, not its expansion.
language = "C++"
namespace = "xrpl"
pragma_once = true
autogen_warning = "// Generated by cbindgen from crates/xrpl-host-functions/src/lib.rs. Do not edit."
no_includes = true
sys_includes = ["cstdint"]

[export]
# An enum is emitted only if listed here, since no `extern fn` names one.
# `TraceDataType` is left out: the cxx bridge already emits `xrpl::TraceDataType`.
include = ["HostError", "FloatOrdering"]

[export.rename]
"HostError" = "HostFunctionError"

[enum]
enum_class = true
