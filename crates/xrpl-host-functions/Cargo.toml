[package]
name = "xrpl-host-functions"
version = "0.1.0"
edition.workspace = true

[dependencies]
xrpl-host-functions-macros.path = "../xrpl-host-functions-macros"

# `wasmi_glue!` and the two argument traits it marshals through are a host's
# business, not a guest's, and this crate is what a contract links against. The
# feature costs nothing either way — a `macro_rules!` is inert and a trait with no
# impls emits nothing — so what it buys is that `cargo doc` here shows a contract
# developer only the ABI.
#
# It is on for every build of this workspace, `xrpl-wasm-vm` enabling it and
# features unifying across the graph. So the off configuration is only ever
# checked by `cargo check -p xrpl-host-functions`, which is in the loop in
# `tmp/notes/wasm-vm/testing.md` for that reason.
[features]
default = []
wasmi_glue = []
