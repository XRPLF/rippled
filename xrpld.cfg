# -------------------------
# 5. Reporting mode settings
# -------------------------

# -------------------------
# 6. Database settings
# -------------------------
[node_db]
online_delete=512
advisory_delete=0
# NuDB
type=NuDB
path=tmp/nudb/data
# RocksDB
#type=RocksDB
#path=tmp/rocksdb/data
#open_files=1200
#filter_bits=12
#cache_mb=256
#file_size_mb=8
#file_size_mult=2
#fast_load=1

[database_path]
# NuDB
tmp/nudb/db
# RocksDB
#tmp/rocksdb/db

[sqlite]
page_size = 4096

# -------------------------
# 7. Diagnostics settings
# -------------------------
[debug_logfile]
/tmp/rippled/debug.log

[perf]
perf_log=/tmp/rippled/perf.log

[insight]
server=statsd
address=127.0.0.1:9125
prefix=rippled

# -------------------------
# 8. Voting settings
# -------------------------

# -------------------------
# 9. Misc settings
# -------------------------
[node_size]
small

[signing_support]
true
