# Validators TOML Configuration Example
#
# This file defines which validators your server trusts not to collude.
# It is located in the same folder as your xrpld.cfg/xrpld.toml file.
#
# For detailed documentation, see validators-example.txt

# Validator List Sites
# List of URIs serving lists of recommended validators.
# Examples:
#   - https://vl.ripple.com
#   - https://unl.xrplf.org
#   - http://127.0.0.1:8000
#   - file:///etc/opt/ripple/vl.txt
validator_list_sites = [
    "https://vl.ripple.com",
    "https://unl.xrplf.org",
]

# Validator List Keys
# List of keys belonging to trusted validator list publishers.
# Validator lists fetched from configured sites will only be considered
# if the list is accompanied by a valid signature from a trusted publisher key.
# Keys should be hex-encoded.
validator_list_keys = [
    # vl.ripple.com
    "ED2677ABFFD1B33AC6FBC3062B71F1E8397C1505E1C42C64D11AD1B28FF73F4734",
    # unl.xrplf.org
    "ED42AEC58B701EEBB77356FFFEC26F83C1F0407263530F068C7C73D392C7E06FD1",
]

# Validator List Threshold
# Minimum number of validator lists on which a validator must be listed
# in order to be used.
#
# This can be set explicitly to any positive integer number not greater than
# the size of validator_list_keys. If it is not set, or set to 0, the
# value will be calculated at startup from the size of validator_list_keys,
# where the calculation is:
#
#   threshold = size(validator_list_keys) < 3
#     ? 1
#     : floor(size(validator_list_keys) / 2) + 1
validator_list_threshold = 0

# Validators
# List of the validation public keys of nodes to always accept as validators.
# Manually listing validator keys is not recommended for production networks.
# Use validator_list_sites and validator_list_keys instead.
#
# Examples:
# validators = [
#     "n9KorY8QtTdRx7TVDpwnG9NvyxsDwHUKUEeDLY3AkiGncVaSXZi5",
#     "n9MqiExBcoG19UXwoLjBJnhsxEhAZMuWwJDRdkyDz1EkEkwzQTNt",
# ]

# Validator Keys (alternative to validators section)
# validator_keys = [
#     "n9KorY8QtTdRx7TVDpwnG9NvyxsDwHUKUEeDLY3AkiGncVaSXZi5",
# ]

