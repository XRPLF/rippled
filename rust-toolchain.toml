# Single source of truth for the Rust toolchain across every environment.
# - rustup-based CI runners and local dev read this file directly (see the
#   prepare-runner action in XRPLF/actions, which runs `rustup toolchain install`).
# - The Nix CI image and dev shell also honour it: rust-overlay reads this file
#   via `rust-bin.fromRustupToolchainFile` (see nix/packages.nix), so the pinned
#   toolchain is delivered from the Nix store and locked by flake.lock.
[toolchain]
channel = "1.95"
components = ["rustfmt", "clippy"]
profile = "minimal"
