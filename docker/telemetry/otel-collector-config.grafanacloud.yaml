# OpenTelemetry Collector configuration — Grafana Cloud dual-export variant.
#
# Identical to otel-collector-config.yaml (local Tempo/Prometheus/Loki) but
# ALSO ships all three signals to Grafana Cloud over a single OTLP/HTTP
# endpoint. Local backends are kept so the on-box stack still works as a
# fallback; for cloud-only, see the comment at the start of service.pipelines.
#
# Selecting this config is a RUNTIME choice — no code or image changes:
#   Local only (default):
#     docker compose -f docker/telemetry/docker-compose.yml up -d
#   Local + Grafana Cloud:
#     docker compose -f docker/telemetry/docker-compose.yml \
#                    -f docker/telemetry/docker-compose.grafanacloud.yaml up -d
#
# The override file mounts THIS config over the collector's config path and
# injects the three required secrets as environment variables:
#   GRAFANA_CLOUD_OTLP_ENDPOINT  e.g. https://otlp-gateway-<zone>.grafana.net/otlp
#   GRAFANA_CLOUD_INSTANCE_ID    numeric Grafana Cloud stack/instance id
#   GRAFANA_CLOUD_API_TOKEN      a Cloud Access Policy token with metrics/traces/logs:write
# Find all three under Grafana Cloud -> Connections -> "OpenTelemetry (OTLP)".

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Basic-auth for the Grafana Cloud OTLP gateway: username = instance id,
  # password = API token. Values come from the container environment so no
  # secret is committed to the repo.
  basicauth/grafanacloud:
    client_auth:
      username: ${env:GRAFANA_CLOUD_INSTANCE_ID}
      password: ${env:GRAFANA_CLOUD_API_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  file_log:
    include:
      - /var/log/xrpld/*/debug.log
    # Needed to recover which node a line came from. The subdirectory name is
    # the only per-node signal in the log stream: Logs::format() writes
    # trace_id and span_id but no node identity. Emitters name the directory
    # after their own service_instance_id so the two agree.
    include_file_path: true
    operators:
      - type: regex_parser
        regex: '^(?P<timestamp>\S+\s+\S+)\s+\S+\s+(?:(?P<partition>\S+):)?(?P<severity>\S+)\s+(?:trace_id=(?P<trace_id>[a-f0-9]+)\s+span_id=(?P<span_id>[a-f0-9]+)\s+)?(?P<message>.*)$'
        timestamp:
          parse_from: attributes.timestamp
          layout: "%Y-%b-%d %H:%M:%S.%f"
          location: UTC
      # Lift the per-node directory out of the file path and onto the
      # RESOURCE. include_file_path alone is not enough: it produces a log
      # RECORD attribute, and on OTLP ingest Loki promotes only an allow-list
      # of RESOURCE attributes to indexed stream labels. A record attribute
      # becomes structured metadata, which cannot be used in a {...} selector.
      # service.instance.id is on that allow-list and arrives as the LogQL
      # label service_instance_id, which is the label the dashboards filter on.
      # Dotted keys need bracket syntax; dot notation would be read as a
      # nested traversal and match nothing.
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        parse_to: attributes
        regex: "^/var/log/xrpld/(?P<node_dir>[^/]+)/"
      - type: move
        from: attributes.node_dir
        to: resource["service.instance.id"]
      # Drop the raw path once the node name is on the resource. Keeping it
      # would add a structured-metadata field to every line for no benefit.
      - type: remove
        field: attributes["log.file.path"]

processors:
  batch:
    timeout: 1s
    send_batch_size: 100
  # Batching for the trace-storage pipeline only. Each request to Grafana
  # Cloud costs a network round trip, so 100-span requests cap how fast
  # stored traces can leave, and at high sampling the cloud exporter's queue
  # fills and drops spans. send_batch_max_size caps one request: keep a full
  # batch under the local Tempo receiver's 4 MiB gRPC message limit.
  batch/store:
    timeout: 1s
    send_batch_size: 2048
    send_batch_max_size: 2048
  # Probabilistic tail sampling, on the trace-storage branch only. The
  # spanmetrics branch sees every span, so span-derived RED metrics stay
  # exact while stored trace volume is cut to bound cost on a long-running
  # node. Operators who need full traces raise sampling_percentage to 100.
  # Note: a log line carries a trace id only when its span was sampled at
  # the SDK, so sampling here drops traces whose ids are already in the
  # logs, and log-to-trace links for those resolve to nothing.
  tail_sampling:
    decision_wait: 10s
    # A trace waits in memory for decision_wait plus up to one 1s tick
    # before it is decided. If more than num_traces new traces arrive in that
    # time, the oldest are dropped undecided and counted in
    # sampling_trace_dropped_too_early. Size it as peak new traces per second
    # x (decision_wait + 1s) x 2. Spans per second is a safe stand-in for new
    # traces per second, since every trace has at least one span. 300000
    # covers a peak of about 13,600 new traces per second. Each waiting trace
    # costs a few KB, so a full table is about 1 GB.
    num_traces: 300000
    # With a decision cache, a decided trace is freed at once and only its id
    # is kept here, which is smaller. Without one, decided traces stay until
    # newer traces push them out, so sampling_traces_on_memory sits at
    # num_traces and cannot warn before drops start. A late span still gets
    # its trace's decision. Keep each cache at least num_traces, so a late
    # span is matched for at least as long as it would be without a cache.
    decision_cache:
      sampled_cache_size: 300000
      non_sampled_cache_size: 300000
    policies:
      - name: half-percent
        type: probabilistic
        probabilistic:
          sampling_percentage: 0.5
  resource/logs:
    attributes:
      - key: service.name
        value: xrpld
        action: upsert
      - key: job
        value: xrpld
        action: upsert
  # Deployment-tier tagging. Each collector serves ONE environment and ONE
  # network, so it stamps both onto every signal it forwards to Grafana
  # Cloud, letting one cloud stack hold data from many collectors and
  # filter by tier.
  #   - deployment.environment: the collector IS the environment (local, ci,
  #     test, prod), so it is authoritative -> upsert (overwrite).
  #   - xrpl.network.type: the xrpld node knows its own chain and already
  #     stamps this, so the collector only fills it when absent -> insert.
  #     This keeps a node's real network (e.g. a local node on mainnet)
  #     from being overwritten by a collector's default.
  # Replace the placeholder values per collector; see the "Deployment
  # Tiers" section of docs/telemetry-runbook.md.
  resource/tier:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert
      - key: xrpl.network.type
        value: mainnet
        action: insert
  # Strip SDK-injected resource attributes (telemetry.sdk.language/name/version).
  # The OpenTelemetry SDK auto-adds these to every Resource; they carry no
  # operational value, so drop them for every signal on every backend.
  resource/stripsdk:
    attributes:
      - key: telemetry.sdk.language
        action: delete
      - key: telemetry.sdk.name
        action: delete
      - key: telemetry.sdk.version
        action: delete
  # Grafana Cloud ingests metrics via OTLP (no Prometheus scrape), so the
  # tier/instance resource attributes never become series labels the way the
  # local prometheus exporter promotes them (resource_to_telemetry_conversion
  # is Prometheus-exporter-only). Copy them onto datapoint labels so the
  # dashboards' $node / $deployment_environment / $xrpl_network_type filters
  # resolve on Cloud exactly as they do locally.
  #
  # NOTE: service.name is intentionally NOT copied here. Cloud's OTLP ingest
  # already promotes service.name to the `service_name` label, and adding a
  # datapoint attribute with the same name causes Mimir to concatenate both
  # values as `xrpld;xrpld`. service.instance.id does not exhibit the same
  # doubling, so the copy for $node is kept.
  transform/cloudlabels:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["service_instance_id"], resource.attributes["service.instance.id"])
          - set(attributes["xrpl_node_id"], resource.attributes["xrpl.node.id"])
          - set(attributes["deployment_environment"], resource.attributes["deployment.environment"])
          - set(attributes["xrpl_network_type"], resource.attributes["xrpl.network.type"])

connectors:
  spanmetrics:
    namespace: "span"
    # Emit span-derived metrics every 15s (default is 60s). Grafana Cloud
    # ingests these as one datapoint per flush, and dashboard rate() panels
    # use [$__rate_interval], which at short ranges (<=1h) can be shorter than
    # the flush interval. A 60s flush left <2 samples per rate window on Cloud,
    # so those panels rendered "No data". 15s keeps >=2 samples per window at
    # every dashboard range, at the cost of ~4x span-metric datapoints to Cloud.
    metrics_flush_interval: 15s
    # Resource attributes that define the resource-metrics grouping key.
    # All resource attributes propagate to the output metrics regardless;
    # label promotion is handled by resource_to_telemetry_conversion on the
    # prometheus exporter. Listing the per-node id and tier keys keeps
    # series from distinct nodes/tiers grouped separately.
    resource_metrics_key_attributes:
      - service.instance.id
      - xrpl.node.id
      - deployment.environment
      - xrpl.network.type
    histogram:
      # Pin unit=ms so the metric stays span_duration_milliseconds_* and le
      # labels stay in ms even if a future collector flips the default to
      # seconds (connector.spanmetrics.useSecondAsDefaultMetricsUnit gate).
      unit: ms
      explicit:
        # Buckets MUST stay strictly ascending (the connector binary-searches
        # them and silently misbuckets otherwise) and MUST match the Alloy
        # list and the other collector config. Sub-millisecond boundaries
        # exist because most xrpld spans sit far below 1ms: a 1ms floor puts
        # nearly every sample in the first bucket and pins p95/p99 to that
        # bucket's edge. Sub-second boundaries cover RPC, tx and ledger spans.
        # The 2s-4s edges resolve second-scale consensus spans, and 10s/30s
        # give the ledger.acquire catch-up tail a home so its p95/p99 stop
        # reading as +Inf. Each edge was chosen from a measured duration
        # distribution for the spans it covers.
        buckets:
          [
            0.01ms,
            0.05ms,
            0.1ms,
            0.25ms,
            0.5ms,
            1ms,
            5ms,
            10ms,
            25ms,
            50ms,
            100ms,
            250ms,
            500ms,
            1s,
            2s,
            3s,
            4s,
            5s,
            10s,
            30s,
          ]
    dimensions:
      - name: command
      - name: rpc_status
      - name: consensus_mode
      # Only the boolean close_time_correct is promoted, never the
      # close_time_ripple_epoch_s value itself: that attribute is a monotonic
      # NetClock timestamp, so a dimension on it would mint a new metric series
      # every ledger (unbounded cardinality). The close-time value is exposed as
      # the server_info last_close_time gauge instead (for last-close age); the
      # close interval comes from the ledgers_closed_total counter.
      - name: close_time_correct
      - name: consensus_state
      - name: local
      - name: proposal_trusted
      - name: validation_trusted
      - name: tx_type
      - name: ter_result
      - name: stage
      - name: txq_status
      - name: load_type
      - name: is_batch
      - name: mode_new
      - name: consensus_stalled
      - name: consensus_phase
      - name: consensus_result
      - name: method
      - name: grpc_role
      - name: grpc_status
      - name: outcome
      - name: acquire_reason

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    # Fed by batch/store, so size the queue in spans: 1000 requests of 2048
    # spans would let a stalled Tempo hold about two million spans in memory.
    sending_queue:
      sizer: items
      queue_size: 100000
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    # Promote resource attributes (deployment.environment, xrpl.network.type,
    # service.name, service.instance.id) to Prometheus labels so the local
    # scrape surface can be filtered by tier. (Grafana Cloud ingests the
    # attributes natively via OTLP, so this only affects the local export.)
    resource_to_telemetry_conversion:
      enabled: true
  # OTLP/HTTP exporter to Grafana Cloud for metrics and logs; stored traces
  # use otlp_http/grafanacloud-traces below. The gateway fans the signals out
  # to hosted Tempo (traces), Mimir/Prometheus (metrics), and Loki (logs).
  # Retry + queue guard against transient gateway errors.
  otlp_http/grafanacloud:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafanacloud
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
  # Stored traces get their own Grafana Cloud exporter, so their queue can be
  # sized in spans without shrinking the metrics and logs queues above, whose
  # requests vary in size. Throughput is about num_consumers x batch size per
  # round trip to the gateway. The queue counts spans still being sent, so
  # more consumers do not add memory.
  otlp_http/grafanacloud-traces:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafanacloud
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      sizer: items
      queue_size: 100000
      num_consumers: 20

service:
  extensions: [health_check, basicauth/grafanacloud]
  pipelines:
    # Local and Grafana Cloud exporters run side by side. For cloud-only,
    # remove otlp/tempo from traces/store and otlp_http/loki from logs, and
    # delete metrics/local (its only exporter is prometheus).
    # 100% of spans feed the spanmetrics connector so span-derived RED
    # metrics stay exact. No tail sampling on this branch.
    traces/metrics:
      receivers: [otlp]
      processors: [resource/tier, resource/stripsdk, batch]
      exporters: [spanmetrics]
    # Trace-STORAGE branch: 0.5% probabilistic tail sampling before Tempo
    # and Grafana Cloud, so stored trace volume is ~1/200 of ingested spans.
    traces/store:
      receivers: [otlp]
      processors: [tail_sampling, resource/tier, resource/stripsdk, batch/store]
      exporters: [otlp/tempo, otlp_http/grafanacloud-traces]
    # The local Prometheus scrape promotes tier/instance resource attrs to
    # labels via resource_to_telemetry_conversion; Grafana Cloud (OTLP) does
    # not, so it runs a separate pipeline that copies them onto datapoint
    # labels via transform/cloudlabels. Splitting avoids the local scrape and
    # the transform both writing a service_instance_id label on the same series.
    metrics/local:
      receivers: [otlp, spanmetrics]
      processors: [resource/tier, resource/stripsdk, batch]
      exporters: [prometheus]
    metrics/cloud:
      receivers: [otlp, spanmetrics]
      processors:
        [resource/tier, resource/stripsdk, transform/cloudlabels, batch]
      exporters: [otlp_http/grafanacloud]
    logs:
      receivers: [file_log]
      processors: [resource/logs, resource/tier, resource/stripsdk, batch]
      exporters: [otlp_http/loki, otlp_http/grafanacloud]
  # The collector's own metrics (dropped traces, export queues and more).
  # The periodic reader posts them to this collector's OTLP receiver, so they
  # take the node metrics' path: resource/tier stamps deployment.environment
  # on them, metrics/local serves them to the local Prometheus scrape and
  # metrics/cloud sends them to Grafana Cloud. Naming the receiver by its
  # compose service name, like the tempo and loki exporters, works whichever
  # interface it binds. Declaring readers drops the default one, so the pull
  # reader keeps the in-container localhost:8888 page. At shutdown the
  # receiver stops first, so the reader's last push fails and the collector
  # exits with status 1.
  telemetry:
    resource:
      attributes:
        # A fixed id, so a restart keeps the same series. The default is a new
        # random id per start. Give each collector that shares a
        # deployment.environment its own value.
        - name: service.instance.id
          value: otel-collector
    metrics:
      readers:
        # 15s, the same as the spanmetrics flush and for the same reason.
        - periodic:
            interval: 15000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://otel-collector:4318
        - pull:
            exporter:
              prometheus:
                host: localhost
                port: 8888
