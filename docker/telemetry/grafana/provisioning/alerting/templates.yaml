# Notification templates for the xrpld OTel alerts.
#
# Why these exist: Grafana's built-in message body appends a raw dump of every
# expression node's value and every label, so a notification reads
# `Value: A=0, B=0, C=1` followed by five `key = value` lines. The refIds carry
# no meaning to a reader, and the label dump repeats what the title already
# says. These templates replace that body with the rule's own prose.
#
# ---------------------------------------------------------------------------
# SLACK ONLY. Email deliberately has no template here.
# ---------------------------------------------------------------------------
# Measured, and the reason this file covers one channel rather than two:
#
#   * Email ESCAPES any HTML in the message body, so a literal `<br>` arrives
#     as `&lt;br&gt;` and no tag or anchor is possible. A custom email body is
#     therefore plain text and cannot reproduce Grafana's default layout, which
#     already gives section headings, a label table, clickable annotation links
#     and the View/Silence buttons. So email keeps the default body.
#   * Slack markup is meaningless in email anyway: bold asterisks, backticks
#     and `:rotating_light:` arrive as literal characters, and a `<url|label>`
#     link cannot become a link, so it dumps the whole URL inline. Four panel
#     links bury the prose in a wall of text. That is what a shared body did.
#   * Real emoji CHARACTERS render in both channels; the `:shortcode:` form
#     only works in Slack.
#
# The value line Grafana's default email body ends with is made readable by
# NAMING each rule's query steps (see rules.yaml), not by replacing the body.
#
# ---------------------------------------------------------------------------
# What a template may and may not use
# ---------------------------------------------------------------------------
# The function set is much smaller than Go's text/template plus sprig.
# Available and used below: `match` (regexp), `reReplaceAll`, `title`, `printf`,
# `len`, `index`, `eq`. NOT available — each fails the whole template with
# `function "X" not defined`: `hasPrefix`, `hasSuffix`, `contains`, `humanize`,
# `humanizeDuration`, `humanizePercentage`.
#
# A template failure is nearly silent, which is the trap. Measured: a missing
# define logs one `failed to template email message` warning and then delivers
# Grafana's DEFAULT body — the value dump and label list this file exists to
# remove — while the rule still reports `health=ok`. So a change here is only
# verified by reading a real delivered notification, never by rule state, and
# never by the absence of an obvious error.
#
# ---------------------------------------------------------------------------
# Two label traps
# ---------------------------------------------------------------------------
#   * `service_instance_id` is a QUERY label, so it is absent whenever Grafana
#     evaluates NoData or Error — those evaluations carry only
#     {datasource_uid, ref_id}. Two rules set `noDataState: Alerting` and so
#     fire that way deliberately. `xrpld.node` below falls back rather than
#     rendering an empty string.
#   * `alertname` is set by Grafana on every alert. There is no `rulename`
#     label, so referencing one renders blank.
#
# Values are deliberately NOT printed. Each rule's `description` already states
# its own measurement, formatted and with its threshold, which is the readable
# form of what the raw value dump was trying to say.

apiVersion: 1

templates:
  - orgId: 1
    name: xrpld.notifications
    template: |
      {{- /* Node identity, or a marker when the query label is absent. */ -}}
      {{ define "xrpld.node" -}}
      {{ if .Labels.service_instance_id }}{{ .Labels.service_instance_id }}{{ else }}unknown node (NoData/Error evaluation){{ end }}
      {{- end }}

      {{- /* One line. Slack title and email subject share this. */ -}}
      {{ define "xrpld.title" -}}
      {{ if .Alerts.Firing }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }}
      {{- with .CommonLabels.alertname }} · {{ . }}{{ end }}
      {{- with .CommonLabels.severity }} ({{ . }}){{ end }}
      {{- with .CommonLabels.service_instance_id }} · {{ . }}{{ end }}
      {{- end }}

      {{- /* SLACK body: mrkdwn, emoji shortcodes, <url|label> links. */ -}}
      {{ define "xrpld.slack.body" -}}
      {{ with .Alerts.Firing }}{{ range . }}
      :rotating_light: *FIRING* · *{{ .Labels.alertname }}* on `{{ template "xrpld.node" . }}`
      {{ .Annotations.description }}
      {{- with .Annotations.action }}
      *Why it matters:* {{ . }}
      {{- end }}
      {{- range $key, $url := .Annotations }}
      {{- if match "^panel_" $key }}
      :chart_with_upwards_trend: <{{ $url }}|{{ title (reReplaceAll "_" " " (reReplaceAll "^panel_" "" $key)) }}>
      {{- end }}{{ end }}
      {{ end }}{{ end }}
      {{- with .Alerts.Resolved }}{{ range . }}
      :white_check_mark: *RESOLVED* · *{{ .Labels.alertname }}* on `{{ template "xrpld.node" . }}`
      {{ .Annotations.description }}
      {{ end }}{{ end }}
      {{- end }}
