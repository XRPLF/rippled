# file_log offset persistence for the Grafana Cloud stack.
#
# Same purpose as otel-collector-filestorage.yaml, and needed for the same
# reason, but it cannot be reused as-is. The collector replaces lists on merge
# rather than appending, so whichever config is passed last decides
# service.extensions outright. The base variant's list,
# [health_check, file_storage/file_log], drops basicauth/grafanacloud and
# leaves the cloud exporters unable to resolve their authenticator. The
# collector then exits at startup with "authenticator not found".
#
# Applied by docker-compose.grafanacloud.yaml, which mounts it over the base
# variant so the command line stays unchanged. Keep the two files in step.

extensions:
  file_storage/file_log:
    directory: /var/lib/otelcol/file_storage
    create_directory: true

receivers:
  file_log:
    storage: file_storage/file_log

# Must name every extension the cloud config needs, not just this file's own:
# lists are replaced, so anything omitted here is omitted from the collector.
service:
  extensions: [health_check, file_storage/file_log, basicauth/grafanacloud]
