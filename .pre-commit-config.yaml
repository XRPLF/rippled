# To run pre-commit hooks, first install pre-commit:
# - `pip install pre-commit==${PRE_COMMIT_VERSION}`
#
# Then, run the following command to install the git hook scripts:
# - `pre-commit install`
# You can run all configured hooks against all files with:
# - `pre-commit run --all-files`
# To manually run a specific hook, use:
# - `pre-commit run <hook_id> --all-files`
# To run the hooks against only the staged files, use:
# - `pre-commit run`
# nodeenv<1.12 resolves the default `latest` to Node pre-releases and crashes parsing them.
default_language_version:
  node: lts

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=400, --enforce-all]
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
        args: [--assume-in-merge]

  - repo: local
    hooks:
      - id: clang-tidy
        name: "clang-tidy (enable with: TIDY=1)"
        entry: ./bin/pre-commit/clang_tidy_check.py
        language: python
        types_or: [c++, c]
        # .ipp fragments are included by their owning header rather than compiled
        # as standalone translation units, so they have no compile_commands.json
        # entry to lint (verify_headers checks them transitively).
        exclude: '^include/xrpl/protocol_autogen|\.ipp$'
        # run-clang-tidy --fix may edit headers included by files it is not run on,
        # so pre-commit must not split the files across parallel hook invocations.
        # The script determines the staged files itself and lets run-clang-tidy
        # handle parallelism internally.
        pass_filenames: false
      - id: fix-include-style
        name: fix include style
        entry: ./bin/pre-commit/fix_include_style.py
        language: python
        types_or: [c++, c]
        exclude: ^include/xrpl/protocol_autogen/(transactions|ledger_entries)/
      - id: fix-pragma-once
        name: fix missing '#pragma once' declarations in header files
        language: python
        entry: ./bin/pre-commit/fix_pragma_once.py
        files: \.(h|hpp)$
      - id: check-doxygen-style
        name: check Doxygen comment style
        entry: ./bin/pre-commit/check_doxygen_style.py
        language: python
        types_or: [c++, c]
      - id: fix-gtest-names
        name: "fix gtest names: CamelCase suite, snake_case test case"
        entry: ./bin/pre-commit/fix_gtest_names.py
        language: python
        types_or: [c++, c]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 98ad4ddb9c057de2f5b9e93e44e6db959807d68c # frozen: v23.1.3
    hooks:
      - id: clang-format
        args: [--style=file]
        types_or: [c++, c, proto]
        exclude: ^include/xrpl/protocol_autogen/(transactions|ledger_entries)/

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path crates/Cargo.toml --all
        language: system
        types: [rust]
        pass_filenames: false # rustfmt formats the whole workspace
      - id: check-coverage-attrs
        name: check Rust coverage attributes
        entry: ./bin/pre-commit/check_rust_coverage_attrs.py
        language: python
        files: ^crates/.*\.rs$

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 28010ddd6016e1a0f7bd232acb6536ef996ae897 # frozen: 0.29.2
    hooks:
      - id: gersemi
        args: [-i, --warnings-as-errors]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # frozen: v3.9.10
    hooks:
      - id: prettier
        args: [--end-of-line=auto]

  # The ruff hook checks every Python file. The mypy hook checks every one
  # except those listed, which have pre-existing findings or share a module name
  # with another file.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88 # frozen: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c # frozen: v2.4.1
    hooks:
      - id: mypy
        args: [--strict]
        exclude: |
          (?x)^(
            \.github/scripts/format-inline-bash\.py|
            \.github/scripts/levelization/generate\.py|
            bin/pre-commit/clang_tidy_check\.py|
            bin/pre-commit/fix_gtest_names\.py|
            bin/pre-commit/test_fix_gtest_names\.py|
            cmake/scripts/codegen/generate_ledger_classes\.py|
            cmake/scripts/codegen/generate_tx_classes\.py|
            cmake/scripts/codegen/macro_parser_common\.py|
            conanfile\.py|
            tests/conan/conanfile\.py
          )$

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9 # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        args: [--write, --indent=4, --case-indent=true]

  - repo: local
    hooks:
      - id: format-inline-bash-workflows
        name: "format `run:` blocks in workflows/actions"
        entry: ./.github/scripts/format-inline-bash.py
        language: python
        files: ^\.github/(workflows|actions)/.*\.ya?ml$
      - id: format-inline-bash-markdown
        name: "format ```bash blocks in markdown"
        entry: ./.github/scripts/format-inline-bash.py
        language: python
        files: \.md$

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: f6467e1f1ebecf5020560405c7b26e01786a43c8 # frozen: v10.4.0
    hooks:
      - id: cspell
        name: check changed files spelling
        exclude: |
          (?x)^(
              \.cspell\.config\.yaml|
              include/xrpl/protocol_autogen/(transactions|ledger_entries)/.*
          )$
      - id: cspell
        name: check commit message spelling
        args:
          - --no-must-find-files
          - --no-progress
          - --no-summary
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: nix-fmt
        name: Format Nix files
        entry: |
          bash -c '
            if command -v nix &> /dev/null || [ "$GITHUB_ACTIONS" = "true" ]; then
              nix --extra-experimental-features "nix-command flakes" fmt "$@"
            else
              echo "Skipping nix-fmt: nix not installed and not in GitHub Actions"
              exit 0
            fi
          ' --
        language: system
        types:
          - nix
        pass_filenames: true

exclude: |
  (?x)^(
      external/.*|
      .github/scripts/levelization/results/.*\.txt|
      src/tests/libxrpl/protocol_autogen/(transactions|ledger_entries)/.*
  )$
